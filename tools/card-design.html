<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte Codex</title>
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Direction artistique : « le Codex ». Une page de manuscrit enluminé : parchemin, filet d'or, encre marine ; la couleur de la
   faction habille le ruban, le médaillon et la fenêtre d'illustration ; la rareté change le métal du cadre. */
:root { --T: "Philosopher", Georgia, serif; --B: "Crimson Text", Georgia, serif; --navy: #1a3864; --ink: #2a2316; --gold: #c8a030; --gold-d: #7a5a10; }
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--B); min-height: 100vh; padding: 28px 16px 60px; background: linear-gradient(160deg, #c8dff5 0%, #ddeeff 28%, #eef4f8 58%, #f4f0e8 100%) fixed; color: var(--navy); }
.row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; justify-content: center; max-width: 1100px; margin: 0 auto 26px; }
h1 { font: 700 22px var(--T); text-align: center; margin-bottom: 18px; }
.cap { font: 14px var(--B); color: #566a86; text-align: center; margin-top: 8px; }

/* ───────── La carte ───────── */
.cd { --fc: #c89a2c; --fd: #6e520e; --ft: #fbf3da; --m1: #c9d3de; --m2: #7d8da0;
  position: relative; width: 100%; aspect-ratio: 5 / 7; container-type: inline-size; filter: drop-shadow(0 .6cqw 1.4cqw rgba(20, 35, 70, .45)); user-select: none; }
.cd.f-AURELIA { --fc: #d3a02a; --fd: #7a5a10; --ft: #fbf1d4; } .cd.f-DRACONIS { --fc: #c8402a; --fd: #6a1c10; --ft: #fbe6df; }
.cd.f-SYLVE { --fc: #3f9a48; --fd: #1a4a20; --ft: #e6f3e1; } .cd.f-ARCANES { --fc: #6a4be0; --fd: #2c1a80; --ft: #ece6fb; } .cd.f-ABYSSES { --fc: #5a7f90; --fd: #1c3040; --ft: #e5edf1; }
/* métal du cadre selon la rareté */
.cd.r-C { --m1: #d3d8de; --m2: #7f8894; } .cd.r-R { --m1: #bcd6f2; --m2: #3f78b4; } .cd.r-E { --m1: #d9c4f7; --m2: #7345c4; } .cd.r-L { --m1: #ffe9a0; --m2: #b8860b; }
.cd-metal { position: absolute; inset: 0; border-radius: 5.4cqw; background: linear-gradient(140deg, var(--m1), var(--m2) 55%, var(--m1) 100%); box-shadow: inset 0 0 0 .5cqw rgba(255, 255, 255, .55), inset 0 -.8cqw 1.4cqw rgba(0, 0, 0, .25); }
.cd.r-L .cd-metal { box-shadow: inset 0 0 0 .5cqw rgba(255, 255, 255, .8), inset 0 -.8cqw 1.4cqw rgba(0, 0, 0, .3), 0 0 4cqw rgba(255, 205, 80, .55); }
.cd-paper { position: absolute; inset: 2.6cqw; border-radius: 3.4cqw; overflow: hidden;
  background: radial-gradient(ellipse at 50% 30%, #fffaf0, #f4ead0 70%, #e6d7b0),
    linear-gradient(var(--ft), var(--ft));
  background-blend-mode: normal;
  box-shadow: 0 0 0 .45cqw var(--gold), 0 0 0 .8cqw var(--gold-d), inset 0 0 6cqw rgba(110, 80, 20, .35); }
.cd-paper::before { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--fc) 9%, transparent); mix-blend-mode: multiply; }
.cd-paper::after { content: ""; position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .34  0 0 0 0 .15  0 0 0 .22 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
.cd > *:not(.cd-metal):not(.cd-paper) { position: absolute; z-index: 2; }

/* ruban du nom */
.cd-ribbon { left: 11cqw; right: 11cqw; top: 5.2cqw; height: 13cqw; display: grid; place-items: center;
  background: linear-gradient(180deg, color-mix(in srgb, var(--fc) 78%, #fff), var(--fc) 30%, var(--fd));
  clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); box-shadow: inset 0 .5cqw 0 rgba(255, 255, 255, .45); filter: drop-shadow(0 .5cqw .6cqw rgba(0, 0, 0, .4)); }
.cd-name { font: 700 6.4cqw/1.02 var(--T); color: #fff; text-align: center; padding: 0 7.5cqw; text-shadow: 0 .45cqw 0 rgba(20, 20, 40, .6); text-wrap: balance; letter-spacing: .1cqw; }
.cd-ribbon-edge { top: 5.2cqw; height: 13cqw; width: 11cqw; background: linear-gradient(180deg, var(--fd), color-mix(in srgb, var(--fd) 60%, #000)); z-index: 1 !important; }
.cd-ribbon-edge.l { left: 5.4cqw; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 22% 50%); } .cd-ribbon-edge.r { right: 5.4cqw; clip-path: polygon(0 0, 100% 0, 78% 50%, 100% 100%, 0 100%); }
/* cristal d'Aether (coût) */
.cd-cost { left: 2.2cqw; top: 2.4cqw; width: 17cqw; height: 19cqw; display: grid; place-items: center; z-index: 4 !important;
  clip-path: polygon(50% 0, 100% 28%, 100% 72%, 50% 100%, 0 72%, 0 28%); background: linear-gradient(150deg, #fff, var(--gold) 12%, var(--gold-d) 100%); }
.cd-cost::before { content: ""; position: absolute; inset: 1.1cqw; clip-path: inherit; background: radial-gradient(circle at 35% 25%, #b9a6ff, #5a3ccf 55%, #24108a); }
.cd-cost b { position: relative; font: 700 10.6cqw/1 var(--T); color: #fff; text-shadow: 0 .5cqw 0 rgba(20, 5, 80, .7); }
/* médaillon de faction */
.cd-sigil { right: 2.6cqw; top: 3.2cqw; width: 14cqw; height: 14cqw; border-radius: 50%; display: grid; place-items: center; z-index: 4 !important; font-size: 8cqw; color: var(--fd);
  background: radial-gradient(circle at 35% 30%, #fffaf0, #eadbb4); box-shadow: 0 0 0 .6cqw var(--gold), 0 0 0 1.1cqw var(--gold-d), 0 .6cqw 1cqw rgba(0, 0, 0, .35); }
.cd-sigil::after { content: ""; position: absolute; inset: 1.4cqw; border-radius: 50%; border: .35cqw solid color-mix(in srgb, var(--fc) 70%, transparent); }
/* fenêtre d'illustration en arche */
.cd-art { left: 9cqw; right: 9cqw; top: 21cqw; height: 52cqw; border-radius: 30cqw 30cqw 2.2cqw 2.2cqw / 24cqw 24cqw 2.2cqw 2.2cqw; overflow: hidden; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 46%, color-mix(in srgb, var(--fc) 40%, #fff), var(--fc) 42%, var(--fd) 100%);
  box-shadow: 0 0 0 .7cqw var(--gold), 0 0 0 1.3cqw var(--gold-d), 0 0 0 1.9cqw rgba(255, 245, 210, .7), inset 0 0 7cqw rgba(0, 0, 0, .5); }
.cd-art::before { content: ""; position: absolute; inset: -30%; background: repeating-conic-gradient(from 0deg at 50% 62%, rgba(255, 255, 255, .13) 0 6deg, transparent 6deg 16deg); }
.cd.f-AURELIA .cd-art::before { background: repeating-conic-gradient(from 0deg at 50% 62%, rgba(255, 255, 255, .16) 0 5deg, transparent 5deg 15deg); }
.cd.f-DRACONIS .cd-art::before { inset: 0; background: radial-gradient(circle at 18% 78%, rgba(255, 210, 120, .9) 0 .5cqw, transparent .7cqw), radial-gradient(circle at 74% 66%, rgba(255, 190, 90, .9) 0 .45cqw, transparent .65cqw), radial-gradient(circle at 52% 88%, rgba(255, 220, 140, .9) 0 .5cqw, transparent .7cqw), radial-gradient(circle at 86% 84%, rgba(255, 170, 70, .8) 0 .4cqw, transparent .6cqw), radial-gradient(circle at 32% 58%, rgba(255, 200, 110, .8) 0 .4cqw, transparent .6cqw), radial-gradient(ellipse at 50% 120%, rgba(255, 120, 30, .55), transparent 60%); }
.cd.f-SYLVE .cd-art::before { inset: 0; background: radial-gradient(ellipse 22% 9% at 20% 30%, rgba(190, 255, 190, .3), transparent), radial-gradient(ellipse 22% 9% at 80% 22%, rgba(190, 255, 190, .3), transparent), radial-gradient(ellipse 20% 8% at 72% 66%, rgba(190, 255, 190, .25), transparent), radial-gradient(ellipse 20% 8% at 22% 72%, rgba(190, 255, 190, .25), transparent), radial-gradient(circle at 50% 40%, rgba(220, 255, 180, .35), transparent 55%); }
.cd.f-ARCANES .cd-art::before { inset: 0; background: radial-gradient(circle at 20% 24%, #fff 0 .35cqw, transparent .5cqw), radial-gradient(circle at 78% 18%, #fff 0 .4cqw, transparent .55cqw), radial-gradient(circle at 64% 44%, #fff 0 .3cqw, transparent .45cqw), radial-gradient(circle at 30% 60%, #fff 0 .3cqw, transparent .45cqw), radial-gradient(circle at 85% 70%, #fff 0 .35cqw, transparent .5cqw), radial-gradient(circle at 12% 82%, #fff 0 .3cqw, transparent .45cqw), radial-gradient(circle at 50% 50%, rgba(190, 170, 255, .45), transparent 58%); }
.cd.f-ABYSSES .cd-art::before { inset: 0; background: radial-gradient(ellipse 60% 22% at 30% 70%, rgba(220, 235, 245, .22), transparent), radial-gradient(ellipse 55% 20% at 72% 52%, rgba(220, 235, 245, .18), transparent), radial-gradient(ellipse 50% 18% at 40% 30%, rgba(220, 235, 245, .14), transparent); }
.cd-art::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(0deg, rgba(0, 0, 0, .35), transparent); }
.cd-sym { position: absolute; font-size: 34cqw; color: #fff; opacity: .15; }
.cd-emoji { position: relative; z-index: 1; font-size: 26cqw; line-height: 1; margin-top: 4cqw; filter: drop-shadow(0 1.2cqw 1.4cqw rgba(0, 0, 0, .55)); }
.cd-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
/* gemmes de rareté sous l'arche */
.cd-gems { left: 0; right: 0; top: 74.6cqw; display: flex; justify-content: center; gap: 2.2cqw; z-index: 3 !important; }
.cd-gems i { width: 4.4cqw; height: 4.4cqw; transform: rotate(45deg); border-radius: .7cqw; background: rgba(90, 70, 30, .22); box-shadow: inset 0 0 0 .3cqw rgba(90, 70, 30, .5); }
.cd-gems i.on { background: linear-gradient(135deg, var(--m1), var(--m2)); box-shadow: 0 0 0 .35cqw var(--gold-d), 0 .3cqw .6cqw rgba(0, 0, 0, .35); }
/* ligne de type */
.cd-type { left: 0; right: 0; top: 80.5cqw; text-align: center; font: 700 3.9cqw/1 var(--T); letter-spacing: .5cqw; text-transform: uppercase; color: var(--fd); }
.cd-type::before, .cd-type::after { content: ""; display: inline-block; width: 11cqw; height: .35cqw; margin: 0 2cqw; vertical-align: middle; background: linear-gradient(90deg, transparent, var(--gold-d)); }
.cd-type::after { background: linear-gradient(270deg, transparent, var(--gold-d)); }
/* texte */
.cd-body { left: 9cqw; right: 9cqw; top: 86.5cqw; bottom: 11.5cqw; padding: 2.2cqw 3cqw; border-radius: 2.2cqw; display: flex; flex-direction: column; justify-content: center; text-align: center;
  background: linear-gradient(180deg, rgba(255, 252, 240, .75), rgba(240, 227, 190, .65)); box-shadow: inset 0 0 0 .35cqw rgba(122, 90, 16, .55), inset 0 .3cqw .8cqw rgba(255, 255, 255, .6); font: 5.9cqw/1.13 var(--B); color: var(--ink); }
.cd-body p + p { margin-top: 1cqw; } .cd-body i { font-style: normal; font-weight: 700; color: var(--fd); }
.cd-kws { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2cqw; margin-bottom: 1.6cqw; }
.cd-kws span { font: 700 4.4cqw/1 var(--T); padding: .9cqw 2.4cqw; border-radius: 99px; color: #fff; background: linear-gradient(180deg, var(--fc), var(--fd)); box-shadow: 0 .3cqw .5cqw rgba(0, 0, 0, .3), inset 0 .3cqw 0 rgba(255, 255, 255, .35); }
/* écus de stats */
.cd-stat { bottom: 1.4cqw; width: 18.5cqw; height: 21cqw; z-index: 4 !important; display: grid; place-items: center; padding-top: 1.2cqw;
  clip-path: polygon(0 0, 100% 0, 100% 64%, 50% 100%, 0 64%); font: 700 11.5cqw/1 var(--T); color: #fff; text-shadow: 0 .5cqw 0 rgba(0, 0, 0, .5); }
.cd-stat::before { content: ""; position: absolute; inset: 0; z-index: -1; clip-path: inherit; background: linear-gradient(150deg, #fff, var(--gold) 14%, var(--gold-d)); }
.cd-stat::after { content: ""; position: absolute; inset: 1.1cqw; z-index: -1; clip-path: inherit; }
.cd-stat.atk { left: 2.2cqw; } .cd-stat.atk::after { background: radial-gradient(circle at 35% 25%, #ff9a6b, #d4481f 50%, #7d1a05); }
.cd-stat.hp { right: 2.2cqw; } .cd-stat.hp::after { background: radial-gradient(circle at 35% 25%, #8be99a, #2f9a4a 50%, #0f5a26); }
.cd-stat small { position: absolute; top: 2.4cqw; font-size: 3.6cqw; opacity: .9; }
.cd-stat span { margin-top: 3cqw; }
/* reflet des Légendaires */
.cd.r-L .cd-paper > .foil { position: absolute; inset: 0; z-index: 5; mix-blend-mode: soft-light; background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, .85) 50%, transparent 68%) 0 0 / 260% 100%; animation: foil 3.4s linear infinite; }
@keyframes foil { from { background-position: 160% 0; } to { background-position: -110% 0; } }
@media (prefers-reduced-motion: reduce) { .cd.r-L .cd-paper > .foil { animation: none; } }
.cd.mini .cd-body, .cd.mini .cd-type, .cd.mini .cd-gems { display: none; }
</style></head>
<body>
<h1>Une carte dans la direction artistique du jeu</h1>
<div class="row" id="row"></div>
<div class="row" id="row2"></div>

<script src="../js/cards.js"></script>
<script>
const F = CA.FACTIONS, KW = CA.KEYWORDS, esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const TIER = { C: 1, R: 2, E: 3, L: 4 };
const SHORT = { charge: "Attaque dès son arrivée.", vif: "Frappe en premier.", garde: "Subit 1 dégât de moins en combat.", egide: "Annule la prochaine source de dégâts.", percee: "Les dégâts en trop touchent la Citadelle.", rage: "+1 Attaque à chaque attaque survivante.", soutien: "Soigne 1 PV aux alliés adjacents chaque tour." };
function card(c, o = {}) {
  const unit = c.type === "unit", fac = F[c.f], r = c.r || "C";
  const kws = (c.kw || []).map((k) => `<span>${KW[k].name}</span>`).join("");
  let lines = CA.cardLines(c).map((l) => `<p>${l.label ? `<i>${l.label} :</i> ` : ""}${esc(l.text)}</p>`).join("");
  if (!lines && unit) lines = (c.kw || []).map((k) => `<p><i>${KW[k].name}.</i> ${SHORT[k]}</p>`).join("");
  return `<div class="cd f-${c.f} r-${r} ${unit ? "unit" : "spell"} ${o.mini ? "mini" : ""}">
    <div class="cd-metal"></div><div class="cd-paper"><span class="foil"></span></div>
    <i class="cd-ribbon-edge l"></i><i class="cd-ribbon-edge r"></i>
    <div class="cd-ribbon"><div class="cd-name">${esc(c.name)}</div></div>
    <div class="cd-cost"><b>${c.c}</b></div><div class="cd-sigil">${fac.sym}</div>
    <div class="cd-art"><span class="cd-sym">${fac.sym}</span><span class="cd-emoji">${c.e}</span>${o.art ? `<img class="cd-img" src="demo-art/${c.id}.webp" alt="">` : ""}</div>
    <div class="cd-gems">${[1, 2, 3, 4].map((n) => `<i class="${n <= TIER[r] ? "on" : ""}"></i>`).join("")}</div>
    <div class="cd-type">${unit ? "Unité" : "Sort"} · ${fac.short}</div>
    <div class="cd-body">${kws && lines && CA.cardLines(c).length ? `<div class="cd-kws">${kws}</div>` : ""}${lines}</div>
    ${unit ? `<div class="cd-stat atk"><small>⚔</small><span>${c.atk}</span></div><div class="cd-stat hp"><small>♥</small><span>${c.hp}</span></div>` : ""}
  </div>`;
}
const big = (id, w, art) => `<div style="width:${w}px">${card(CA.BY_ID[id], { art })}<div class="cap">${CA.BY_ID[id].name}</div></div>`;
document.getElementById("row").innerHTML = big("A12", 330) + big("D15", 330);
document.getElementById("row2").innerHTML = ["D11", "S12", "R11", "M13"].map((id) => big(id, 215)).join("");
</script>
</body></html>
